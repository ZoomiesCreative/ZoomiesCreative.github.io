  main {

    padding: 32px 16px 64px;
  }
  .summary {

  }

  }
  h3 { font-size: 18px; margin: 20px 0 4px; color: var(--ink); }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  a { color: var(--plum); text-decoration-color: var(--rose); text-underline-offset: 3px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 15px;
    background: var(--card);
  }
  th, td {
    text-align: left;
    vertical-align: top;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  th { background: #f3ebef; color: var(--plum); font-weight: 500; }
  .table-wrap { overflow-x: auto; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 24px 16px 40px;
    border-top: 1px solid var(--line);
  }
</style>
</head>

</header>
