<style>
  :root{
    --ink:#4A3955;
    --ink-soft:#7C6B87;
    --base:#FDFBF9;
    --panel:#F6F0EF;
    --gold:#D4A64C;
    --rose:#D4A195;
    --sage:#9BA390;
    --line:rgba(74,57,85,0.14);
    --max:880px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--base);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Playfair Display', serif;
    color:var(--ink);
    margin:0;
    font-weight:600;
  }
  a{color:inherit;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}

  /* ---------- header ---------- */
  header{padding:32px 0;}
  .header-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .wordmark{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.01em;
    text-decoration:none;
    color:var(--ink);
  }
  nav{display:flex; gap:30px;}
  nav a{
    font-size:14px;
    letter-spacing:0.03em;
    text-decoration:none;
    color:var(--ink-soft);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  nav a:hover{color:var(--ink); border-color:var(--gold);}

  /* ---------- hero ---------- */
  .hero{
    padding:24px 0 88px;
    text-align:center;
  }
  .hero-logo{
    width:220px;
    height:auto;
    margin:0 auto 12px;
    display:block;
  }
  .hero h1{
    font-size:clamp(32px, 4.6vw, 46px);
    max-width:13em;
    margin:0 auto;
    font-style:italic;
    font-weight:500;
  }
  .divider{
    width:56px;
    height:2px;
    background:var(--gold);
    margin:28px auto;
    border:none;
  }
  .hero p{
    max-width:480px;
    margin:0 auto;
    font-size:17px;
    color:var(--ink-soft);
  }
  .petals{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:32px;
  }
  .petal{
    width:8px;
    height:8px;
    border-radius:50%;
  }
  .petal.gold{background:var(--gold);}
  .petal.rose{background:var(--rose);}
  .petal.sage{background:var(--sage);}

  /* ---------- apps ---------- */
  .apps{padding:16px 0 96px;}
  .apps h2{
    font-size:26px;
    text-align:center;
    margin-bottom:40px;
    font-style:italic;
    font-weight:500;
  }
  .app-panel + .app-panel{margin-top:28px;}
  .app-panel{
    background:var(--panel);
    border-radius:4px;
    border-top:2px solid var(--gold);
    padding:48px;
    display:flex;
    gap:28px;
    align-items:flex-start;
    max-width:640px;
    margin:0 auto;
  }
  .app-icon{
    flex:0 0 auto;
    width:64px;
    height:64px;
    border-radius:50%;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:20px;
    color:var(--gold);
  }
  .app-text{flex:1;}
  .app-name{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:10px;
  }
  .app-desc{
    color:var(--ink-soft);
  }
  .app-link{
    display:inline-block;
    margin-top:20px;
    font-size:14px;
    letter-spacing:0.03em;
    text-decoration:none;
    color:var(--ink);
    border-bottom:1px solid var(--rose);
    padding-bottom:2px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .app-link:hover{color:var(--rose); border-color:var(--gold);}
  .app-links{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:20px;}
  .app-links .app-link{margin-top:0;}
  .app-soon{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border:1px solid var(--sage);
    border-radius:999px;
    padding:1px 10px;
    margin-left:10px;
    vertical-align:middle;
  }
